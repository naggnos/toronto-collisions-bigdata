# Project configuration. Notebooks read every path and parameter from here.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  figures: results/figures
  tables: results/tables

study_period:
  start: 2014-01-01
  end: 2025-12-31
speed_period:            # detailed WYS speed analysis (RQ2)
  start: 2023-01-01
  end: 2025-12-31

# Time-based split for the severity model (never use future data to predict the past)
split:
  train_years: [2014, 2022]
  val_years: [2023, 2023]
  test_years: [2024, 2025]

covid_period:
  start: 2020-03-15
  end: 2021-12-31

spatial:
  wys_buffer_m: 150
  sensitivity_buffers_m: [100, 250, 500]

weather_stations:
  precipitation: [toronto_city, toronto_city_centre]      # primary, fallback
  visibility: [toronto_intl_a, toronto_city_centre]

spark:
  app_name: toronto-collisions
  master: local[*]
  driver_memory: 16g
  shuffle_partitions: 64

# E4 tool comparison (RQ4). Smaller sizes use complete months, not sampled rows.
e4:
  tools: [pandas, duckdb, spark]
  fractions: [0.25, 0.5, 0.75, 1.0]
  cores: [1, 2, 4, 8, 16]      # pandas runs single-threaded only
  formats: [csv, parquet]
  repeats: 3                   # report the median

robustness:
  drop_duplicates: true
  exclude_years: [2020, 2021]

seed: 42
